# Example configuration file for sslh-hub.
#
# Mount it at /etc/sslh/sslh.cfg (or point SSLH_CONFIG at another path) and
# the container runs sslh with this file instead of the *_HOST/*_PORT
# environment variables. Everything sslh can do is available this way:
# routing by SNI or ALPN, regex probes, UDP protocols, per-protocol logging.
#
# Reference: https://github.com/yrutschle/sslh/blob/master/example.cfg
#            https://github.com/yrutschle/sslh/blob/master/doc/config.md

# The entrypoint always adds -f (foreground) and -n (numeric logging, so client
# addresses are never sent to a DNS resolver). SSLH_USER, when set, overrides
# `user` below; set SSLH_USER to an empty string to let this file decide.
user: "nobody";

# Seconds to wait for a recognisable protocol before using the catch-all.
timeout: 2;

# Set to 0 to stop logging the client address of each connection.
verbose-connections: 1;

listen:
(
    { host: "0.0.0.0"; port: "443"; }
    # IPv6 as well:
    # , { host: "[::]"; port: "443"; }
);

# Probed in order; `anyprot` matches everything and must come last.
protocols:
(
    # resolve_on_forward re-resolves the backend name on every connection,
    # which matters when the backend is a container that may restart with a
    # new address. Without it, names are resolved once at startup.
    { name: "ssh";     host: "localhost"; port: "22";   resolve_on_forward: true; },
    # Send one SNI name to a dedicated backend, everything else below.
    # { name: "tls"; host: "git"; port: "443"; sni_hostnames: [ "git.example.com" ]; },
    { name: "tls";     host: "localhost"; port: "8443"; },
    { name: "openvpn"; host: "localhost"; port: "1194"; },
    # { name: "http";  host: "localhost"; port: "80";   },
    { name: "anyprot"; host: "localhost"; port: "8388"; }
);
